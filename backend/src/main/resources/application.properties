spring.application.name=ecolift-backend
# Render injects the PORT dynamically. Defaults to 8080 locally.
server.port=${PORT:8083}

# PostgreSQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
#MAP
app.maps.ors-api-key=${ORS_API_KEY:}
# JWT
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# Email OTP
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
application.security.otp.expiration-minutes=10
# Resend (transactional email over HTTPS — avoids blocked SMTP ports on Render)
application.resend.api-key=${RESEND_API_KEY}
application.resend.from-address=${RESEND_FROM_ADDRESS:onboarding@resend.dev}

# Uploads and URLs
app.upload.dir=uploads/profile-pictures
# Needs to be your Render URL in production
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Agora
application.security.agora.app-id=${AGORA_APP_ID}
application.security.agora.app-certificate=${AGORA_APP_CERT}
